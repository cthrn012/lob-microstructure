name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # pak installs prebuilt binaries and any system libraries they need.
      - name: Install packages
        run: |
          Rscript -e 'install.packages("pak")'
          Rscript -e 'pak::pkg_install(c("DBI", "RSQLite", "ggplot2", "rmarkdown", "knitr", "testthat", "duckdb"))'

      - name: Check install.R finds everything
        run: Rscript install.R

      - name: Tests (SQLite and DuckDB)
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Pipeline smoke run (one simulated day)
        run: Rscript run_all.R
