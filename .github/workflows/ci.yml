name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages
        run: |
          Rscript install.R
          Rscript -e 'install.packages("duckdb")'

      - name: Tests (SQLite and DuckDB)
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Pipeline smoke run (one simulated day)
        run: Rscript run_all.R
